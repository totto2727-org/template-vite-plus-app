name: CI

# Keep this trigger when creating a project from the template.
# Change it only for an explicit user request or a demonstrated project requirement.
# Do not replace main-push publication with tag or release triggers.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: totto2727-org/monorepo/.github/actions/setup-nix@main
      - uses: totto2727-org/monorepo/.github/actions/setup-typescript@main
      - name: Verify Vite+ project
        run: |
          eval "$(nix print-dev-env "$GITHUB_WORKSPACE#default")"
          vp run ci
